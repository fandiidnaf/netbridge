name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build Multi-Arch Binaries
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag originates from main branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag ${{ github.ref_name }} is not an ancestor of main branch. Releases must originate from main!"
            exit 1
          fi
          echo "Tag ${{ github.ref_name }} successfully verified on main branch."

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          
          # Darwin ARM64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.version=${TAG_NAME}" -o dist/netbridge-darwin-arm64 ./cmd/netbridge
          tar -czf dist/netbridge-${TAG_NAME}-darwin-arm64.tar.gz -C dist netbridge-darwin-arm64
          
          # Darwin AMD64 (Intel Mac)
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.version=${TAG_NAME}" -o dist/netbridge-darwin-amd64 ./cmd/netbridge
          tar -czf dist/netbridge-${TAG_NAME}-darwin-amd64.tar.gz -C dist netbridge-darwin-amd64

          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${TAG_NAME}" -o dist/netbridge-linux-amd64 ./cmd/netbridge
          tar -czf dist/netbridge-${TAG_NAME}-linux-amd64.tar.gz -C dist netbridge-linux-amd64

          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${TAG_NAME}" -o dist/netbridge-linux-arm64 ./cmd/netbridge
          tar -czf dist/netbridge-${TAG_NAME}-linux-arm64.tar.gz -C dist netbridge-linux-arm64

          cd dist && shasum -a 256 *.tar.gz > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
